# One-off operator utility: derive the ed25519 PUBLIC key (hex) from the
# signing secret, so the consumer instance can be configured with the
# matching PRINCIPE_UPDATES_PUBLIC_KEY. Only the PUBLIC key is printed —
# the private key never leaves the runner's memory.
name: derive-pubkey
on:
  workflow_dispatch:
jobs:
  derive:
    runs-on: ubuntu-latest
    steps:
      - name: Derive public key hex from the signing PEM
        env:
          PRINCIPE_UPDATES_PRIVATE_KEY: ${{ secrets.PRINCIPE_UPDATES_PRIVATE_KEY }}
        run: |
          node -e '
            const crypto = require("crypto");
            const pem = process.env.PRINCIPE_UPDATES_PRIVATE_KEY;
            if (!pem) { console.error("secret missing"); process.exit(1); }
            const priv = crypto.createPrivateKey(pem);
            const pub = crypto.createPublicKey(priv);
            const spki = pub.export({ format: "der", type: "spki" });
            // ed25519 SPKI = 12-byte prefix + 32 raw bytes.
            console.log("PUBHEX=" + spki.subarray(12).toString("hex"));
          '
