# SPDX-License-Identifier: AGPL-3.0-or-later
# Daily pipeline: fetch → distill → legal → dedup → lifecycle → emit.
# In review mode (B) it opens a PR; in auto mode (A) it pushes to main.
# The B→A switch is the PUBLISH_MODE repo variable — no code change.
name: daily-feed

on:
  schedule:
    - cron: "17 5 * * *" # 05:17 UTC daily
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  build-snapshot:
    runs-on: ubuntu-latest
    env:
      PRINCIPE_OSS_DIR: vendor/principe-oss
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'review' }}
      FEED_PAUSED: ${{ vars.FEED_PAUSED || '0' }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive # vendor/principe-oss (SSRF fetch + build-bundle)
          # principe-oss is private; the default job token is scoped to this
          # repo only. SUBMODULE_TOKEN (a PAT with read access to
          # principe-oss) authenticates the submodule clone.
          token: ${{ secrets.SUBMODULE_TOKEN || github.token }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile --dir vendor/principe-oss

      - name: Run pipeline
        run: node --import tsx src/run-daily.ts

      - name: Publish snapshot (PR in review mode, push in auto mode)
        run: |
          set -e
          if [ "$FEED_PAUSED" = "1" ]; then echo "kill-switch active"; exit 0; fi
          git config user.name "principe-feed-bot"
          git config user.email "bot@principe.local"
          if git diff --quiet -- knowledge feed-metadata.json state; then
            echo "no changes today"; exit 0
          fi
          DATE=$(date -u +%F)
          if [ "$PUBLISH_MODE" = "auto" ]; then
            git add knowledge feed-metadata.json state
            git commit -m "feed: daily snapshot $DATE (auto)"
            git push origin HEAD:main
          else
            BR="feed/$DATE"
            git checkout -b "$BR"
            git add knowledge feed-metadata.json state
            git commit -m "feed: daily snapshot $DATE"
            git push origin "$BR"
            gh pr create --base main --head "$BR" \
              --title "Daily feed snapshot $DATE" \
              --body "Review the diff — it IS the digest. Merge to publish, close to skip."
          fi
