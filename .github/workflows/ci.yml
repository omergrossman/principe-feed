name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Typecheck + unit tests for the pipeline logic. No submodule needed —
# src/scripts don't statically import vendor/ (the bundle build invokes it at
# runtime), so neither tsc nor the tests require vendor/principe-oss.
jobs:
  check:
    name: typecheck · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
